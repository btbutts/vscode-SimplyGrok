<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Grok Question Input</title>
    <style>
        body { 
            margin: 0;
            padding: 20px;
            font-family: var(--vscode-font-family);
            height: 100vh;
            overflow: auto;
            box-sizing: border-box;
        }
        #question {
            width: 100%;
            height: 400px;
            resize: vertical;
            font-family: var(--vscode-font-family-monospaced);
            font-size: var(--vscode-editor-font-size);
            background-color: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border: 1px solid var(--vscode-input-border);
            padding: 10px;
            box-sizing: border-box;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow: auto;
            -webkit-spellcheck: true;
            -webkit-user-modify: read-write-plaintext-only;
        }
        #question.placeholder {
            color: var(--vscode-input-placeholderForeground);
            opacity: 1;
        }
        .buttons {
            margin-top: 20px;
            padding-bottom: 30px;
            text-align: center;
        }
        button {
            margin: 0 10px;
            padding: 8px 16px;
            font-size: var(--vscode-font-size);
        }
        h3 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h3>Enter your question for Grok (multiline supported):</h3>
    <div
        id="question"
        contenteditable="true"
        spellcheck="true"
        autocorrect="on"
        autocapitalize="off"></div>
    <div class="buttons">
        <button id="submit-btn">Submit</button>
        <button id="cancel-btn">Cancel</button>
    </div>
    <script type="text/javascript">
        'use strict';
        const vscode = acquireVsCodeApi();
        const question = document.getElementById('question');
        // Isolates drafts per webview instance; prevents cross-tab/session persistence after cancel/close/X
        let STORAGE_KEY = '';  // Starts empty; set to unique `vscodeGrokQuestionDraft_${sessionId}` via postMessage from extension
        const placeholderText = "Type your question here...\nUse Enter for new lines, copy/paste from other tabs, etc...";

        // Listen for setSessionId postMessage from extension (TS side); sets unique STORAGE_KEY
        window.addEventListener('message', function(event) {
          const message = event.data;
          if (message.command === 'setSessionId') {
            STORAGE_KEY = `vscodeGrokQuestionDraft_${message.sessionId}`;
            loadDraft();  // Initial load after key set (empty first time)
          }
        });

        // Persistence functions to save text in case
        // user switches away and comes back to webview
        // during editing.
        function saveDraft() {
            if (STORAGE_KEY && !question.classList.contains('placeholder')) {
                sessionStorage.setItem(STORAGE_KEY, question.innerText);
            }
        }

        function loadDraft() {
            const saved = STORAGE_KEY ? sessionStorage.getItem(STORAGE_KEY) : null;
            if (saved && saved.trim()) {
                question.innerText = saved;
                question.classList.remove('placeholder');
            } else {
                // Fallback to placeholder if no draft
                question.innerText = placeholderText;
                question.classList.add('placeholder');
            }
        }

        function clearDraft() {
            if (STORAGE_KEY) {
                sessionStorage.removeItem(STORAGE_KEY);
            }
        }

        // Set initial placeholder or restore draft
        //loadDraft();

        // Set language for native fallback (no spellcheck=true; Typo.js replaces unreliable native)
        question.lang = navigator.language || 'en-US';  // Language dict for spellcheck (user locale fallback)

        question.addEventListener('focus', function() {
            if (question.classList.contains('placeholder')) {
                question.classList.remove('placeholder');
                question.innerText = '';
            }
            enableSpellcheck();  // Re-enable on focus (tab switch refresh)
        });

        question.addEventListener('blur', function() {
            saveDraft();  // Persist on blur (tab switch)
            if (question.innerText.trim() === '') {
                question.classList.add('placeholder');
                question.innerText = placeholderText;
            }
        });

        // Ensure placeholder class is removed on input/paste/etc. + persist
        question.addEventListener('input', function() {
            question.classList.remove('placeholder');
            saveDraft();  // Auto-save on every change
        });

        question.addEventListener('paste', function() {
            question.classList.remove('placeholder');
            saveDraft();  // Auto-save on paste
        });

        // Additional persistence: visibility/page events (tab switches, minimize)
        document.addEventListener('visibilitychange', function() {
          if (document.hidden) {
            saveDraft();
          } else {
            loadDraft();
          }
        });

        window.addEventListener('pagehide', saveDraft);  // Before unload/tab switch
        window.addEventListener('pageshow', loadDraft);  // On load/tab switch back

        // Typo.js integration for spellcheck (suggestions) + autocorrect (top suggest on space/enter)
        // Replaces native spellcheck (unreliable in webviews) + old capitalize (integrated)
        // Async load via injected <script>; no blocking; event-driven checks.
        let typoInstance = null;
        let isTypoReady = false;
        let suggestionMenu = null;

        // Init Typo.js (async dict load; callback-safe)
        function initTypo() {
          if (typeof Typo === 'undefined') {
            console.warn('Typo.js not loaded (check resources/lib/typo.js)');
            return;
          }
          // asyncLoadDictionary=true (default); Levenshtein for better suggests
          typoInstance = new Typo("en_US", false, true, {
            dictionaryPath: window.TYPO_DICT_PATH || 'dictionaries'  // From injected global (webview URI)
          });
          typoInstance.ready(function () {
            isTypoReady = true;
            console.log('Typo.js ready (en_US dictionary loaded)');
            // Optional: retro-check last word on ready
          });
        }

        // Get word immediately before cursor (for autocorrect/contextmenu)
        // Uses innerText (plaintext-only safe); \w regex for alphanumeric words.
        function getWordBeforeCursor() {
          const sel = window.getSelection();
          if (!sel || !sel.rangeCount) return null;
          const range = sel.getRangeAt(0);
          const offset = range.startOffset;
          const text = question.innerText;
          let start = offset;
          while (start > 0 && /\w/.test(text[start - 1])) {
            start--;
          }
          const word = text.slice(start, offset).toLowerCase().trim();  // Lowercase for check/suggest
          return word.length > 1 ? word : null;
        }

        // Show suggestion popup (top 5; positioned at cursor; click to replace)
        // Non-blocking DOM ops; hides on outside click.
        function showSuggestions(suggestions) {
          if (suggestionMenu) suggestionMenu.remove();
          suggestionMenu = document.createElement('div');
          suggestionMenu.style.position = 'fixed';  // Fixed for scroll-safe
          suggestionMenu.style.backgroundColor = 'var(--vscode-input-background)';
          suggestionMenu.style.border = '1px solid var(--vscode-input-border)';
          suggestionMenu.style.borderRadius = '4px';
          suggestionMenu.style.padding = '4px 0';
          suggestionMenu.style.zIndex = '10000';
          suggestionMenu.style.fontFamily = 'var(--vscode-font-family-monospaced)';
          suggestionMenu.style.fontSize = 'var(--vscode-editor-font-size)';
          suggestionMenu.style.boxShadow = '0 2px 8px rgba(0,0,0,0.2)';
          const sel = window.getSelection();
          if (sel.rangeCount) {
            const rect = sel.getRangeAt(0).getBoundingClientRect();
            suggestionMenu.style.left = `${rect.left}px`;
            suggestionMenu.style.top = `${rect.bottom + 4}px`;
            suggestionMenu.style.minWidth = `${rect.width}px`;
          }
          suggestions.slice(0, 5).forEach((sugg) => {  // Top 5 only (perf)
            const item = document.createElement('div');
            item.textContent = sugg;
            item.style.padding = '4px 8px';
            item.style.cursor = 'pointer';
            item.style.color = 'var(--vscode-input-foreground)';
            item.onmouseover = () => { item.style.backgroundColor = 'var(--vscode-input-hoverBackground)'; };
            item.onmouseout = () => { item.style.backgroundColor = ''; };
            item.onclick = (ev) => {
              ev.stopPropagation();
              document.execCommand('insertText', false, sugg);  // Replace at cursor (deprecated but webview-safe)
              if (suggestionMenu) suggestionMenu.remove();
            };
            suggestionMenu.appendChild(item);
          });
          if (suggestionMenu.children.length === 0) return;  // No suggs
          document.body.appendChild(suggestionMenu);
        }

        // Hide suggestions (outside click/esc)
        function hideSuggestions() {
          if (suggestionMenu) {
            suggestionMenu.remove();
            suggestionMenu = null;
          }
        }

        // Integrated autocorrect + capitalize (beforeinput; non-blocking)
        // Typo-aware: autocorrect last word on space/enter if misspelled; fallback capitalize.
        question.addEventListener('beforeinput', function(e) {  // InputEvent
          if (!isTypoReady || !typoInstance) return;  // Guard: wait for async ready

          const inputType = e.inputType;
          const inputData = e.data;

          if (inputType === 'insertText' && (inputData === ' ' || inputData === '\n')) {
            // Autocorrect: check/replace last word proactively
            const lastWord = getWordBeforeCursor();
            if (lastWord && !typoInstance.check(lastWord)) {
              const suggestions = typoInstance.suggest(lastWord);
              if (suggestions.length > 0) {
                const correction = suggestions[0];  // Top suggestion (autocorrect)
                if (correction && correction.length < 50) {  // Sanity (no absurd suggs)
                  e.preventDefault();
                  // Insert correction + inputData (space/enter) via execCommand (cursor-safe)
                  document.execCommand('insertText', false, correction + inputData);
                  return;  // Skip capitalize
                }
              }
            }

            // Fallback/enhance: Capitalize after .!? (existing logic; Typo-safe)
            const text = question.innerText;
            const lastChar = text.slice(-1);
            if (['.', '!', '?'].includes(lastChar)) {
              // Auto-capitalize next word (insert upper)
              e.preventDefault();
              document.execCommand('insertText', false, inputData.toUpperCase());
            }
          }
        });

        // Contextmenu: right-click word → suggestions popup (visual spellcheck replacement)
        question.addEventListener('contextmenu', function(e) {
          if (!isTypoReady || !typoInstance) return;
          const word = getWordBeforeCursor();
          if (word && !typoInstance.check(word)) {
            e.preventDefault();  // Block native menu
            showSuggestions(typoInstance.suggest(word));
          }
        });

        // Hide suggestions on outside click/esc (non-blocking)
        document.addEventListener('click', hideSuggestions);
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') hideSuggestions();
        });

        // Init Typo.js post-DOM (async; no block)
        initTypo();

        function submit() {
            clearDraft();  // Clear on submit
            let text = '';
            if (!question.classList.contains('placeholder')) {
                text = question.innerText;
            }
            vscode.postMessage({
                command: 'submit',
                text: text
            });
        }
        
        function cancel() {
            clearDraft();  // Clear on cancel
            vscode.postMessage({
                command: 'cancel'
            });
        }
        document.getElementById('submit-btn').addEventListener('click', submit);
        document.getElementById('cancel-btn').addEventListener('click', cancel);
        document.focus();
    </script>
</body>
</html>
